<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>JobScroll — 스크롤로 찾는 내 다음 직장</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>" />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" as="style" crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css"
    />
  </head>
  <body>

    <!-- ─── 상단 바 ─── -->
    <header class="top-bar" id="topBar">
      <div class="logo">
        <span class="logo__icon">⚡</span>
        <span class="logo__text">JobScroll</span>
      </div>

      <div class="job-counter" id="jobCounter">— / —</div>

      <div class="top-bar-actions">
        <button class="icon-btn" id="filterBtn" title="필터·검색">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="4" y1="6" x2="20" y2="6"/>
            <line x1="8" y1="12" x2="16" y2="12"/>
            <line x1="11" y1="18" x2="13" y2="18"/>
          </svg>
        </button>
        <button class="icon-btn crawl-btn" id="crawlBtn" title="실시간 크롤링">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="23 4 23 10 17 10"/>
            <polyline points="1 20 1 14 7 14"/>
            <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- ─── Stories 뷰포트 ─── -->
    <div class="stories-vp" id="storiesVp">

      <!-- 배경 그라디언트 (job 별 색상) -->
      <div class="story-bg" id="storyBg"></div>
      <div class="story-overlay"></div>

      <!-- 상단: 슬라이드 진행 표시바 -->
      <div class="story-progress" id="storyProgress"></div>

      <!-- 회사 정보 헤더 -->
      <div class="story-header" id="storyHeader">
        <div class="story-logo" id="storyLogo"></div>
        <div class="story-header-info">
          <div class="story-company-name" id="storyCompanyName"></div>
          <div class="story-company-sub" id="storyCompanySub"></div>
        </div>
        <div class="story-category-badge" id="storyCategoryBadge"></div>
      </div>

      <!-- 슬라이드 콘텐츠 영역 -->
      <div class="story-content-wrap" id="storyContentWrap">
        <div class="story-content" id="storyContent"></div>
      </div>

      <!-- 우측 액션 버튼 모음 -->
      <div class="story-actions" id="storyActions">
        <button class="sa-btn" id="likeBtn">
          <div class="sa-icon" id="likeIcon">🤍</div>
          <span class="sa-count" id="likeCount">0</span>
        </button>
        <button class="sa-btn" id="saveBtn">
          <div class="sa-icon" id="saveIcon">📌</div>
          <span class="sa-label" id="saveLabel">저장</span>
        </button>
        <button class="sa-btn" id="shareBtn">
          <div class="sa-icon">↗️</div>
          <span class="sa-label">공유</span>
        </button>
      </div>

      <!-- 투명 탭 존 (좌 40% / 우 60%) — z-index 아래에 있으므로 버튼은 정상 클릭 가능 -->
      <div class="tap-zone tap-left" id="tapLeft"></div>
      <div class="tap-zone tap-right" id="tapRight"></div>

      <!-- 스와이프 방향 힌트 플래시 -->
      <div class="swipe-flash" id="swipeFlash"></div>

      <!-- 로딩 / 끝 상태 오버레이 -->
      <div class="story-state-overlay" id="storyStateOverlay" style="display:none">
        <div class="state-box" id="stateBox"></div>
      </div>
    </div>

    <!-- ─── 하단 내비게이션 ─── -->
    <nav class="bottom-nav">
      <button class="bnav-btn active" data-tab="feed">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
          <rect x="3" y="3" width="7" height="7" rx="1"/>
          <rect x="14" y="3" width="7" height="7" rx="1"/>
          <rect x="3" y="14" width="7" height="7" rx="1"/>
          <rect x="14" y="14" width="7" height="7" rx="1"/>
        </svg>
        <span>탐색</span>
      </button>
      <button class="bnav-btn" data-tab="saved">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/>
        </svg>
        <span>저장</span>
      </button>
      <button class="bnav-btn" data-tab="profile">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
        <span>내 정보</span>
      </button>
    </nav>

    <!-- ─── 저장 패널 ─── -->
    <div class="side-panel" id="savedPanel">
      <div class="panel-header">
        <h2>저장한 공고</h2>
        <span class="saved-count-badge" id="savedCountBadge">0</span>
      </div>
      <div class="saved-list" id="savedList">
        <div class="empty-state">
          <div class="empty-icon">🔖</div>
          <p>저장한 공고가 없어요.<br/>마음에 드는 공고를 저장해 보세요!</p>
        </div>
      </div>
    </div>

    <!-- ─── 프로필 패널 ─── -->
    <div class="side-panel" id="profilePanel">
      <div class="panel-header"><h2>내 정보</h2></div>
      <div class="profile-content">
        <div class="profile-avatar">👤</div>
        <p class="profile-name">구직자님 환영해요!</p>
        <p class="profile-sub">JobScroll로 다음 커리어를 찾아보세요</p>
        <div class="profile-stats">
          <div class="stat-item">
            <span class="stat-num" id="statViewed">0</span>
            <span class="stat-label">본 공고</span>
          </div>
          <div class="stat-item">
            <span class="stat-num" id="statLiked">0</span>
            <span class="stat-label">좋아요</span>
          </div>
          <div class="stat-item">
            <span class="stat-num" id="statSaved">0</span>
            <span class="stat-label">저장</span>
          </div>
        </div>
        <div class="interaction-guide">
          <p class="guide-title">조작 방법</p>
          <div class="guide-item">
            <span class="guide-icon">👆</span>
            <span>우측 탭 → 다음 세부 슬라이드</span>
          </div>
          <div class="guide-item">
            <span class="guide-icon">👆</span>
            <span>좌측 탭 → 이전 슬라이드</span>
          </div>
          <div class="guide-item">
            <span class="guide-icon">👉</span>
            <span>우 스와이프 → 공고 묶음 건너뛰기</span>
          </div>
          <div class="guide-item">
            <span class="guide-icon">👈</span>
            <span>좌 스와이프 → 이전 공고 묶음</span>
          </div>
        </div>
      </div>
    </div>

    <!-- ─── 필터 패널 (바텀 시트) ─── -->
    <div class="filter-overlay" id="filterOverlay">
      <div class="filter-sheet" id="filterSheet">
        <div class="filter-handle"></div>
        <div class="filter-header">
          <span class="filter-title">필터 · 검색</span>
          <button class="icon-btn" id="filterClose">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
            </svg>
          </button>
        </div>
        <div class="filter-section">
          <p class="filter-section-label">카테고리</p>
          <div class="filter-cats" id="filterCats">
            <button class="fcat-btn active" data-category="전체">전체</button>
            <button class="fcat-btn" data-category="IT/개발">IT / 개발</button>
            <button class="fcat-btn" data-category="데이터/AI">데이터 · AI</button>
            <button class="fcat-btn" data-category="디자인">디자인</button>
            <button class="fcat-btn" data-category="기획/PM">기획 · PM</button>
          </div>
        </div>
        <div class="filter-section">
          <p class="filter-section-label">키워드 검색</p>
          <div class="filter-search-row">
            <input type="text" id="filterKeyword" class="filter-input" placeholder="회사명, 직무, 스킬..." />
          </div>
        </div>
        <button class="filter-apply-btn" id="filterApply">적용하기</button>
      </div>
    </div>

    <!-- ─── 토스트 ─── -->
    <div class="toast" id="toast"></div>

    <!-- ─── 크롤링 오버레이 ─── -->
    <div class="crawl-overlay" id="crawlOverlay">
      <div class="crawl-box">
        <div class="crawl-spinner"></div>
        <p class="crawl-text">실시간 채용공고 수집 중...</p>
        <p class="crawl-sub">사람인 · 잡코리아에서 데이터를 가져오고 있어요</p>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
